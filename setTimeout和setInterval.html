<body>
  <script>

    function printNumbers(from, to) {
      console.log(from++)
       let timer = setTimeout(function go() {
          if (from > to) {
            clearTimeout(timer)
          } else {
            console.log(from++)
          }
          setTimeout(go, 1000)
       }, 1000)
    }
    printNumbers(1, 5)
    function printNumbers1(from, to) {
      let timer = setInterval(() => {
        console.log(from++)
        if (from > to) {
          clearInterval(timer)
        }
      }, 1000)
    }
    // printNumbers1(1,5)   
  </script>
