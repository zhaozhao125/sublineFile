<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<style>
  .mt-4 {
    margin: 10px;
  }
</style>
<div id="app"></div>
<script>
  const {h, createApp} = Vue;
  const Stack = {
    render() {
      console.log(this.$props, 'props')
      const slot = this.$slots.default ? this.$slots.default() : []
      return h('div', {class: "stack"}, slot.map(child => {
        return h('div', {class: `mt-4`}, [
          child
        ])
      }))
    }
  }
  const App = {
    components: {
      Stack
    },
    template: `
    <Stack size="4">
      <div>hello</div>
      <Stack size="4">
        <div>2</div>
        <div>3</div>
        <Stack size="4">
        <div>4</div>
        <div>5</div>
      </Stack>
      </Stack>
      
    </Stack>
    `
  }
  createApp(App).mount('#app')

</script>
